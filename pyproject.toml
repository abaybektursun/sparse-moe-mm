[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sparse-moe-mm"
version = "0.1.0"
description = "Quantized (FP8/NVFP4) proxy-gated all-3-matrix sparse grouped_mm for fine-grained MoE inference"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "torch>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
gpu = ["triton>=3.2"]

[project.entry-points."vllm.general_plugins"]
prog8_sparse_fp8 = "sparse_moe_mm.vllm_plugin:register"

[tool.setuptools.packages.find]
include = ["sparse_moe_mm*"]
